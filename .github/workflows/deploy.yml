name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "=== Starting deployment ==="

            cd /home/teams.aidbro.com/workflow

            # The repo is owned by workflowapp but deploy runs as root — mark it safe.
            git config --global --add safe.directory /home/teams.aidbro.com/workflow

            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            echo "--- Updating code ---"
            git fetch origin
            git reset --hard origin/main
            echo "New commit: $(git rev-parse HEAD)"

            echo "--- Updating backend dependencies ---"
            source backend/.venv/bin/activate
            pip install -r backend/requirements.txt --quiet

            echo "--- Stopping service before migrations (prevents DDL lock contention) ---"
            systemctl stop workflowapp

            echo "--- Running migrations ---"
            cd backend
            if ! alembic upgrade head; then
              echo "!!! Migration failed — rolling back code to $PREV_COMMIT"
              cd ..
              git reset --hard "$PREV_COMMIT"
              source backend/.venv/bin/activate
              pip install -r backend/requirements.txt --quiet
              systemctl start workflowapp
              exit 1
            fi
            cd ..

            echo "--- Starting backend service ---"
            systemctl start workflowapp
            sleep 8

            echo "--- Health check ---"
            if ! systemctl is-active --quiet workflowapp || ! curl -sfk https://127.0.0.1:8001/health > /dev/null; then
              echo "!!! Health check failed — rolling back to $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              source backend/.venv/bin/activate
              pip install -r backend/requirements.txt --quiet
              systemctl restart workflowapp
              sleep 5
              systemctl is-active --quiet workflowapp \
                && echo "Rollback OK — previous version restored" \
                || echo "Rollback restart also failed — manual intervention required"
              exit 1
            fi

            echo "Backend healthy."

            echo "--- Building frontend ---"
            cd frontend
            npm install --silent
            npm run build
            cp -r dist/* /home/teams.aidbro.com/public_html/
            cd ..

            echo "--- Publishing agent release ---"
            VERSION_FILE="agent/version.txt"
            if [ -f "$VERSION_FILE" ]; then
              VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
              AGENT_EXE="agent/dist/WorkFlowAgent_${VERSION}.exe"
              if [ -f "$AGENT_EXE" ]; then
                CHECKSUM=$(sha256sum "$AGENT_EXE" | awk '{print $1}')
                mkdir -p /home/teams.aidbro.com/public_html/downloads
                cp "$AGENT_EXE" /home/teams.aidbro.com/public_html/downloads/WorkFlowAgent.exe
                [ -f agent/dist/install_agent.bat ] && cp agent/dist/install_agent.bat /home/teams.aidbro.com/public_html/downloads/install_agent.bat
                [ -f agent/dist/uninstall_agent.bat ] && cp agent/dist/uninstall_agent.bat /home/teams.aidbro.com/public_html/downloads/uninstall_agent.bat
                printf '{"version":"%s","checksum":"%s","download_url":"https://teams.aidbro.com/downloads/WorkFlowAgent.exe"}' \
                  "$VERSION" "$CHECKSUM" > agent_release.json
                echo "Agent release published: v$VERSION"
              else
                echo "agent/dist/WorkFlowAgent_${VERSION}.exe not found — skipping agent release"
              fi
            else
              echo "agent/version.txt not found — skipping agent release"
            fi

            echo "=== Deployment complete: $(git rev-parse HEAD) ==="
